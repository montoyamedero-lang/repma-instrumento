<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REPMA | Evaluación intuitiva</title>
<style>
:root{--azul:#112d51;--naranja:#e77c24;--fondo:#f1f5fa}
*{box-sizing:border-box}body{margin:0;background:var(--fondo);color:var(--azul);font-family:Arial,sans-serif}
header{background:var(--azul);color:white;text-align:center;padding:24px 16px}header h1{margin:0 0 8px;font-size:26px}header p{margin:0;font-size:14px}
main{max-width:1000px;margin:26px auto;padding:0 16px}.panel{background:white;border-radius:18px;padding:26px;box-shadow:0 8px 25px #112d5118;margin-bottom:18px}
h2{margin-top:0}.sub{color:#50617a;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opcion{border:2px solid #d7e0ec;border-radius:12px;background:white;padding:10px;cursor:pointer;text-align:center;color:var(--azul);font:inherit}
.opcion:hover,.opcion:focus-visible{border-color:var(--naranja)}.opcion.activa{border:3px solid var(--naranja);background:#fff8f1}
.opcion img{width:100%;height:145px;object-fit:cover;border-radius:8px;display:block;margin-bottom:8px}.opcion .emoji{font-size:48px;display:block;margin:6px 0}
.opcion strong{display:block;margin:4px 0}.opcion small{color:#51617b}.acciones{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
button.accion{background:var(--azul);color:white;border:0;border-radius:10px;padding:13px 18px;font-size:15px;cursor:pointer}button.accion.secundaria{background:#e8eef5;color:var(--azul)}button.accion:disabled{opacity:.45;cursor:not-allowed}
.comparacion{display:grid;grid-template-columns:1fr 1fr;gap:16px}.tarjeta{border:2px solid #d7e0ec;border-radius:14px;padding:16px;text-align:center}.tarjeta img{width:100%;max-height:220px;object-fit:cover;border-radius:10px}.tarjeta .emoji{font-size:60px;margin:10px}.tarjeta.elegida{border-color:var(--naranja)}
.aviso{padding:12px;background:#fff7ed;border-radius:10px;color:#80501f}.oculto{display:none!important}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.comparacion{grid-template-columns:1fr}.panel{padding:17px}.opcion img{height:110px}}
@media print{header{background:white;color:var(--azul)}body{background:white}.panel{box-shadow:none}.acciones,.no-imprimir{display:none!important}main{max-width:100%}}

/* Diseño de la pantalla de transición REPMA */
.transicion-titulo {
  font-size: 28px;
  color: #112d51;
  margin-bottom: 14px;
}

.transicion-intro {
  font-size: 17px;
  line-height: 1.55;
  color: #304866;
}

.transicion-pasos {
background: #e7f1fa;
  border-radius: 14px;
  padding: 20px;
  margin: 20px 0;
}

.transicion-pasos h2 {
  margin: 0 0 18px;
  color: #112d51;
}

.transicion-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.transicion-paso {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 14px;
  line-height: 1.45;
}

.transicion-numero {
  background: #e77c24;
  color: white;
  border-radius: 50%;
  width: 28px;
  height: 28px;
  min-width: 28px;
  display: grid;
  place-items: center;
  font-weight: bold;
}

.transicion-importante {
  background: #fff5df;
  border-left: 5px solid #f0b544;
  border-radius: 12px;
  padding: 18px 22px;
  margin: 18px 0;
  line-height: 1.5;
}

.transicion-importante h2 {
  color: #112d51;
  margin-top: 0;
}

@media (max-width: 640px) {
  .transicion-grid {
    grid-template-columns: 1fr;
  }
}


.ilustracion-intuicion {
  float: right;
  width: 230px;
  max-width: 30%;
  height: auto;
  margin: 0 0 15px 25px;
}

@media (max-width: 640px) {
  .ilustracion-intuicion {
    float: none;
    display: block;
    max-width: 75%;
    margin: 15px auto;
  }
}


/* Nuevas pantallas: confirmación y transición racional */
.repma-etapa{font-size:13px;font-weight:700;letter-spacing:.08em;color:#e77c24;text-transform:uppercase}
.repma-hero{display:grid;grid-template-columns:180px 1fr;gap:24px;align-items:center;background:#f5f8fc;border:1px solid #d7e0ec;border-radius:16px;padding:20px;margin:20px 0}
.repma-ilustracion{width:100%;max-height:170px;object-fit:contain}
.repma-linea{font-size:clamp(25px,4vw,40px);font-weight:800;color:#112d51;overflow-wrap:anywhere}
.repma-resumen{background:#eaf2fb;border-radius:14px;padding:18px;line-height:1.6;margin:20px 0}
.repma-criterios{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}
.repma-criterio{background:#f5f8fc;border:1px solid #d7e0ec;border-radius:12px;padding:14px;text-align:center}
.repma-criterio svg{width:45px;height:45px;display:block;margin:0 auto 10px}
.repma-criterio strong{display:block;margin-bottom:8px}
.repma-criterio small{line-height:1.4;color:#50617a}
.repma-primario{background:#e77c24!important;font-weight:700}
@media(max-width:640px){.repma-hero{grid-template-columns:1fr;text-align:center}.repma-ilustracion{max-height:135px}.repma-criterios{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{.repma-criterios{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* Presentación fiel a la referencia visual de las pantallas de transición */
body.repma-final header{background:linear-gradient(115deg,#092749,#0b3769);text-align:left;padding:19px max(24px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}
body.repma-final header h1{font-size:clamp(22px,3vw,34px);letter-spacing:.015em;margin:0 0 8px;font-weight:800}
body.repma-final header h1::after{content:'';display:block;width:105px;height:5px;border-radius:5px;background:#f57b1c;margin-top:5px}
body.repma-final header p{font-size:15px}
body.repma-final header .repma-cabecera-etapa{border-left:1px solid #ffffff55;padding-left:22px;font-size:17px;line-height:1.3;min-width:195px}
body.repma-final header .repma-cabecera-etapa b{display:block;font-size:21px}
body.repma-final main{max-width:1100px;margin:0 auto;padding:0 16px 24px}
body.repma-final .panel{padding:28px 35px 24px;border-radius:0 0 20px 20px;box-shadow:0 12px 28px #112d5110}
.repma-final .repma-etapa{display:none}
.repma-final .repma-titulo-elegido{display:flex;align-items:center;gap:20px;margin-bottom:16px}
.repma-final .repma-titulo-elegido h2{font-size:clamp(30px,4.4vw,52px);line-height:1.1;letter-spacing:-.03em;margin:0}
.repma-final .repma-marca-check{width:83px;height:83px;flex:0 0 83px}
.repma-final .repma-texto{font-size:clamp(16px,1.8vw,20px);line-height:1.42;color:#304866}
.repma-final .repma-hero{grid-template-columns:42% 1fr;gap:26px;align-items:center;background:#fff9f2;border:2px solid #fa761d;padding:12px 16px;border-radius:16px;margin:20px 0}
.repma-final .repma-foto-linea{display:block;width:100%;height:180px;object-fit:cover;border-radius:9px}
.repma-final .repma-linea{font-size:clamp(26px,4vw,48px);line-height:1.12}
.repma-final .repma-hero .sub{color:#112d51;font-size:17px;font-weight:700;margin:0 0 12px}
.repma-final .repma-resumen{display:flex;align-items:center;gap:16px;background:#eaf2fb;padding:17px 20px}
.repma-final .repma-resumen svg.repma-bombilla{width:58px!important;height:58px!important;min-width:58px;max-width:58px;max-height:58px;flex:0 0 58px;display:block}
.repma-final .repma-resumen strong{font-size:20px}
.repma-final .repma-resumen p{margin:6px 0 0;font-size:17px;line-height:1.4}
.repma-final .acciones{align-items:center;margin-top:16px}
.repma-final .repma-primario{background:#f37019!important;border-radius:999px;font-size:19px;padding:16px 22px;min-width:0}
.repma-final .repma-primario:not(:disabled){flex:1}
.repma-final .repma-titulo-racional{font-size:clamp(32px,4.7vw,56px);line-height:1.06;letter-spacing:-.025em;margin:0 0 20px}
.repma-final .repma-titulo-racional span{color:#ee591d;display:block}
.repma-final .repma-banda-razon{display:flex;align-items:center;gap:20px;background:#eaf2fb;border-radius:14px;padding:13px 18px;margin:20px 0}
.repma-final .repma-banda-razon svg{width:64px;height:64px;flex:0 0 64px}
.repma-final .repma-banda-razon strong{font-size:19px;line-height:1.4}
.repma-final .repma-caja-criterios{background:#f4f9ff;border:1px solid #d8e7f8;border-radius:16px;padding:18px;margin:18px 0}
.repma-final .repma-caja-criterios h3{font-size:23px;margin:0}
.repma-final .repma-criterios{margin:10px 0 0;gap:0}
.repma-final .repma-criterio{border:0;border-right:1px solid #d7e0ec;border-radius:0;background:transparent;padding:8px 12px}
.repma-final .repma-criterio:last-child{border:0}
.repma-final .repma-criterio svg{width:58px;height:58px}
.repma-final .repma-criterio strong{font-size:15px}
.repma-final .repma-criterio small{font-size:13px}
.repma-final .repma-aviso-futuro{font-size:13px;margin:10px 0 0;color:#53627a}
/* Fotos de expresiones: etiquetas ya incluidas en las propias fotografías */
.opcion .emoji-foto{height:auto;aspect-ratio: 16/9;object-fit:cover}
.tarjeta .emoji-foto{width:100%;height:auto;max-height:none;aspect-ratio:16/9;object-fit:cover;display:block;margin:8px auto}
@media(max-width:680px){body.repma-final header{padding:16px;align-items:flex-start}body.repma-final header .repma-cabecera-etapa{font-size:12px;min-width:0;padding-left:10px}body.repma-final header .repma-cabecera-etapa b{font-size:14px}body.repma-final .panel{padding:20px 16px}.repma-final .repma-titulo-elegido{gap:10px}.repma-final .repma-marca-check{width:50px;height:50px;flex-basis:50px}.repma-final .repma-hero{grid-template-columns:1fr;gap:12px}.repma-final .repma-foto-linea{height:165px}.repma-final .repma-resumen{align-items:flex-start}.repma-final .repma-criterios{grid-template-columns:repeat(2,minmax(0,1fr))}.repma-final .repma-criterio:nth-child(2){border-right:0}.repma-final .repma-primario{width:100%;font-size:16px}}
@media print{body.repma-final header{background:white!important;color:#112d51!important}body.repma-final .panel{box-shadow:none}.repma-final .repma-hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* Ajuste específico de la tercera fase según maqueta aprobada */
body.repma-final.repma-racional main{max-width:1100px}
.repma-racional .repma-titulo-racional{font-size:clamp(34px,4.2vw,52px);margin:0 0 18px;line-height:1.08}
.repma-racional .repma-titulo-racional span{display:block;color:#f05a22}
.repma-racional .repma-banda-razon{padding:16px 20px;gap:18px;margin:20px 0 17px}
.repma-racional .repma-banda-razon svg{width:74px;height:74px;flex:0 0 74px}
.repma-racional .repma-banda-razon strong{font-size:18px;font-weight:400}
.repma-racional .repma-banda-razon strong b{font-weight:800}
.repma-racional .repma-caja-criterios{background:#f6faff;padding:18px 16px 14px;margin:18px 0 14px}
.repma-racional .repma-caja-criterios h3{font-size:22px;margin:0 0 6px}
.repma-racional .repma-criterio{padding:7px 12px}
.repma-racional .repma-criterio svg{width:70px;height:70px;margin-bottom:8px}
.repma-racional .repma-criterio strong{font-size:15px}
.repma-racional .repma-criterio small{font-size:13px;display:block}
.repma-racional .repma-criterio svg{background:#e3efff;border-radius:50%;padding:9px}
.repma-racional .repma-criterio:nth-child(2) svg{background:#fff0d8}
.repma-racional .repma-criterio:nth-child(3) svg{background:#e0f2e8}
.repma-racional .repma-criterio:nth-child(4) svg{background:#eee7ff}
.repma-racional .repma-acciones-racional{display:flex;flex-direction:column;align-items:stretch;gap:8px;margin-top:12px}
.repma-racional .repma-acciones-racional .repma-primario{order:0;display:block;width:94%;align-self:center;padding:17px 22px;font-size:22px;background:#f37019!important;opacity:1}
.repma-racional .repma-acciones-racional .repma-primario:disabled{opacity:1;cursor:not-allowed}
.repma-racional .repma-acciones-racional .secundaria{order:1;align-self:flex-start;font-size:13px;padding:7px 10px}
.repma-racional .repma-aviso-futuro{margin:0;font-size:12px;color:#5e6980}
@media(max-width:680px){.repma-racional .repma-acciones-racional .repma-primario{width:100%;font-size:16px}.repma-racional .repma-banda-razon svg{width:54px;height:54px;flex-basis:54px}.repma-racional .repma-criterio svg{width:56px;height:56px}}

/* Versión de prueba: refinamiento visual de las dos pantallas aprobadas.
   Las elecciones, fotografías, botones y transiciones se mantienen intactos. */
body.repma-final{background:#eef4fb}
body.repma-final header{padding-top:18px;padding-bottom:18px}
body.repma-final .panel{background:#fff;border-radius:0 0 19px 19px}
.repma-final .repma-titulo-elegido h2{font-weight:800}
.repma-final .repma-hero{background:linear-gradient(110deg,#fff,#fff8f0)}
.repma-final .repma-resumen{background:linear-gradient(110deg,#e9f2fd,#f2f7ff)}
.repma-final .repma-primario{background:#f36b14!important;color:#fff;box-shadow:none}
.repma-final .repma-primario:hover:not(:disabled){background:#dc5b0a!important}
.repma-racional .repma-titulo-racional{margin-bottom:16px}
.repma-racional .repma-banda-razon{background:linear-gradient(90deg,#e7f2ff,#edf5fd);border-radius:14px}
.repma-racional .repma-banda-razon svg{width:66px;height:66px;flex-basis:66px}
.repma-racional .repma-caja-criterios{border:1px solid #d5e7fa;background:#f5faff}
.repma-racional .repma-criterio svg{width:68px;height:68px;box-sizing:border-box}
.repma-racional .repma-acciones-racional .repma-primario{border-radius:999px;background:#f36b14!important}
.repma-racional .repma-acciones-racional .repma-primario:disabled{color:#fff;opacity:1;cursor:not-allowed}
@media(max-width:680px){body.repma-final .panel{padding:22px 17px}.repma-final .repma-titulo-elegido{gap:10px}.repma-final .repma-marca-check{width:55px;height:55px;flex-basis:55px}.repma-racional .repma-criterios{grid-template-columns:repeat(2,minmax(0,1fr))}.repma-racional .repma-criterio:nth-child(2){border-right:0}.repma-racional .repma-criterio{border-bottom:1px solid #d7e0ec}.repma-racional .repma-criterio:nth-child(n+3){border-bottom:0}}
</style>

}
